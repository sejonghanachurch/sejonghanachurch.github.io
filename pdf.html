<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>if(location.protocol==='http:'&&location.hostname==='sejonghanachurch.com')location.replace(location.href.replace(/^http:/,'https:'));</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#001b54">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg">
  <title>주보 | 세종하나교회</title>
  <link rel="stylesheet" href="./styles.css?v=bulletin-canvas-20261008">
  <style>
    html,body{height:100%;overflow:hidden;background:var(--pale)}
    body{display:flex;flex-direction:column;height:100vh;height:100dvh}
    #pdf-toolbar{flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
    .pdf-heading{display:flex;align-items:center;gap:20px;margin-bottom:10px}.pdf-heading a{flex-shrink:0;color:var(--primary);font-weight:700}.pdf-heading h1{font-family:var(--body);font-size:17px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
    .pdf-controls,.pdf-controls>div{display:flex;align-items:center;justify-content:center;gap:8px}.pdf-controls{justify-content:space-between;flex-wrap:wrap}
    .pdf-controls button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--primary);font:inherit;cursor:pointer;padding:6px 10px}.pdf-controls button:disabled{opacity:.4;cursor:default}.pdf-controls button:hover:not(:disabled){background:var(--pale)}
    #pdf-page-number{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}#pdf-zoom{min-width:42px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}#pdf-fit{font-size:14px}
    #pdf-pages{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px;touch-action:pan-x pan-y pinch-zoom}
    .pdf-document{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:100%;width:max-content}
    .pdf-sheet{flex-shrink:0;background:#fff;box-shadow:0 4px 20px #001b5412}.pdf-page{display:block;max-width:none;margin:0;background:#fff}
    #pdf-status{flex:1;display:grid;place-content:center;text-align:center;padding:28px}
    #pdf-status h2{font-size:24px}#pdf-status p{color:var(--muted)}
    #pdf-status .button-row{justify-content:center}
    #pdf-pages[hidden],#pdf-status[hidden],#pdf-status .button-row[hidden]{display:none}
    @media(max-width:380px){.pdf-controls{gap:6px}.pdf-controls,.pdf-controls>div{column-gap:4px}.pdf-controls button{padding:6px 8px}#pdf-fit{font-size:13px}#pdf-zoom{min-width:34px}#pdf-page-number{min-width:44px}}
  </style>
</head>
<body>
  <header id="pdf-toolbar">
    <div class="pdf-heading"><a href="./#/news/bulletins">‹ 주보 목록</a><h1 id="pdf-title">주보</h1></div>
    <div class="pdf-controls" aria-label="주보 보기 도구">
      <span id="pdf-page-number" aria-live="polite">주보</span>
      <div><button id="pdf-zoom-out" aria-label="축소" disabled>−</button><span id="pdf-zoom">100%</span><button id="pdf-zoom-in" aria-label="확대" disabled>+</button><button id="pdf-fit" disabled>화면 맞춤</button></div>
    </div>
  </header>
  <div id="pdf-status" role="status">
    <h2>주보를 불러오고 있습니다.</h2>
    <p>잠시만 기다려 주세요.</p>
    <div class="button-row" hidden><button id="retry" class="button solid">다시 열기</button><a class="button outline" href="./#/news/bulletins">주보 목록</a></div>
  </div>
  <main id="pdf-pages" aria-label="주보 내용" aria-busy="true" tabindex="0" hidden></main>
  <script type="module" src="./js/pdf-viewer.js?v=bulletin-canvas-20261008"></script>
</body>
</html>
